services:
  - type: web
    name: stock-paper-trading-dashboard
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: STOCK_SYMBOLS
        value: auto
      - key: MAX_SYMBOLS
        value: "35"
      - key: USE_OPENAI_PREMIUM
        value: auto
      - key: AI_BACKTEST_ENABLED
        value: "true"
      - key: ENABLE_TRADING_SKILLS
        value: "true"
